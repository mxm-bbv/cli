name: build-binaries

# Builds forge on every push to main (and on demand) and publishes the compiled
# binaries to an orphan `dist` branch. The server pulls that branch to update —
# no compiling on the server, repo stays private, and `dist` is force-updated so
# history doesn't grow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Real apt repos, OpenSSH and fail2ban on every supported release: the step
  # engine runs inside each distro's container (see live_container_test.go).
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build live test binary
        run: CGO_ENABLED=0 go test -c -o steps.test ./internal/steps
      - name: Provision inside ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e FORGE_LIVE=1 -v "$PWD/steps.test:/steps.test:ro" "$IMAGE" \
            /steps.test -test.run Live -test.v

  build:
    needs: distros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest patched Go: the binary embeds the stdlib (net/http, TLS),
          # so an out-of-support toolchain ships unpatched vulnerabilities.
          go-version: stable
          cache: true

      - name: Vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        run: |
          mkdir -p out
          VERSION="$(git describe --tags --always 2>/dev/null || echo "${GITHUB_SHA::7}")"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o out/forge-linux-$arch .
            sha256sum out/forge-linux-$arch | awk '{print $1}' > out/forge-linux-$arch.sha256
          done
          ( cd out && sha256sum forge-linux-amd64 forge-linux-arm64 > checksums.txt )

      - name: Publish to dist branch (force)
        run: |
          cd out
          git init -q
          git config user.name  "forge-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b dist
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
